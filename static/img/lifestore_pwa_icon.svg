<!-- static/img/lifestore_pwa_icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Silver Metallic Gradient for Apple -->
    <linearGradient id="appleMetallicGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#F1F5F9" />
      <stop offset="45%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="pwaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <filter id="appleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Canvas Background (100% White) -->
  <rect width="512" height="512" fill="#FFFFFF" />

  <!-- Squircle Card -->
  <rect x="36" y="36" width="440" height="440" rx="105" ry="105"
        fill="#FFFFFF"
        stroke="url(#cardBorderGrad)"
        stroke-width="5"
        filter="url(#pwaShadow)" />

  <!-- Big Metallic Apple Logo (Center-Top) -->
  <g transform="translate(142, 75) scale(12.8)" filter="url(#appleShadow)">
    <!-- Leaf -->
    <path d="M15.22 6.13c.69-.84 1.15-2.01.99-3.18-1.01.04-2.2.66-2.91 1.5-.63.73-1.18 1.9-1.02 3.03 1.12.09 2.25-.51 2.94-1.35z" 
          fill="url(#appleMetallicGrad)" />
    <!-- Apple Body -->
    <path d="M16.14 7.62c-1.57-.09-2.91.9-3.67.9-.76 0-1.89-.86-3.12-.84-1.6.02-3.08.93-3.9 2.37-1.68 2.89-.43 7.17 1.2 9.51.8 1.14 1.74 2.41 2.99 2.36 1.21-.05 1.66-.77 3.12-.77 1.46 0 1.88.77 3.14.75 1.29-.02 2.11-1.16 2.89-2.31.91-1.32 1.29-2.6 1.31-2.67-.03-.01-2.52-.96-2.54-3.83-.02-2.39 1.95-3.53 2.05-3.6-1.12-1.64-2.85-1.82-3.47-1.87z" 
          fill="url(#appleMetallicGrad)" />
  </g>

  <!-- LIFESTORE Text with Black Apple as 'O' -->
  <g transform="translate(74, 400)">
    <!-- LIFEST text -->
    <text x="0" y="0" 
          font-family="'Inter', 'Montserrat', -apple-system, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="2"
          fill="#1A1A1A">LIFEST</text>

    <!-- Black Apple replacing 'O' -->
    <g transform="translate(195, -38) scale(2.05)">
      <path d="M15.22 6.13c.69-.84 1.15-2.01.99-3.18-1.01.04-2.2.66-2.91 1.5-.63.73-1.18 1.9-1.02 3.03 1.12.09 2.25-.51 2.94-1.35z" 
            fill="#1A1A1A" />
      <path d="M16.14 7.62c-1.57-.09-2.91.9-3.67.9-.76 0-1.89-.86-3.12-.84-1.6.02-3.08.93-3.9 2.37-1.68 2.89-.43 7.17 1.2 9.51.8 1.14 1.74 2.41 2.99 2.36 1.21-.05 1.66-.77 3.12-.77 1.46 0 1.88.77 3.14.75 1.29-.02 2.11-1.16 2.89-2.31.91-1.32 1.29-2.6 1.31-2.67-.03-.01-2.52-.96-2.54-3.83-.02-2.39 1.95-3.53 2.05-3.6-1.12-1.64-2.85-1.82-3.47-1.87z" 
            fill="#1A1A1A" />
    </g>

    <!-- RE text -->
    <text x="244" y="0" 
          font-family="'Inter', 'Montserrat', -apple-system, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="2"
          fill="#1A1A1A">RE</text>
  </g>
</svg>
