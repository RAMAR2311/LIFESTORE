<!-- static/img/lifestore_master_logo.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Silver Metallic Gradient for Apple & Accents -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#C0C0C0" />
      <stop offset="75%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Metallic Letter Gradient -->
    <linearGradient id="silverLetterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Metallic Stroke Gradient -->
    <linearGradient id="silverStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Group for LIFESTORE Brand Display -->
  <g transform="translate(30, 20)">
    <!-- Letters L I F E S T -->
    <text x="0" y="105" 
          font-family="'Inter', 'Montserrat', -apple-system, sans-serif" 
          font-size="108" 
          font-weight="900" 
          letter-spacing="4"
          fill="url(#silverLetterGrad)" 
          stroke="url(#silverStrokeGrad)" 
          stroke-width="2.5"
          filter="url(#subtleGlow)">LIFEST</text>

    <!-- Apple Logo replacing 'O' -->
    <!-- Positioned right after 'LIFEST' around x=480 -->
    <g transform="translate(485, 12) scale(5.2)" filter="url(#subtleGlow)">
      <!-- Leaf -->
      <path d="M15.22 6.13c.69-.84 1.15-2.01.99-3.18-1.01.04-2.2.66-2.91 1.5-.63.73-1.18 1.9-1.02 3.03 1.12.09 2.25-.51 2.94-1.35z" 
            fill="url(#silverGrad)" 
            stroke="#94A3B8" 
            stroke-width="0.3" />
      <!-- Body -->
      <path d="M16.14 7.62c-1.57-.09-2.91.9-3.67.9-.76 0-1.89-.86-3.12-.84-1.6.02-3.08.93-3.9 2.37-1.68 2.89-.43 7.17 1.2 9.51.8 1.14 1.74 2.41 2.99 2.36 1.21-.05 1.66-.77 3.12-.77 1.46 0 1.88.77 3.14.75 1.29-.02 2.11-1.16 2.89-2.31.91-1.32 1.29-2.6 1.31-2.67-.03-.01-2.52-.96-2.54-3.83-.02-2.39 1.95-3.53 2.05-3.6-1.12-1.64-2.85-1.82-3.47-1.87z" 
            fill="url(#silverGrad)" 
            stroke="#94A3B8" 
            stroke-width="0.3" />
    </g>

    <!-- Letters R E -->
    <text x="605" y="105" 
          font-family="'Inter', 'Montserrat', -apple-system, sans-serif" 
          font-size="108" 
          font-weight="900" 
          letter-spacing="4"
          fill="url(#silverLetterGrad)" 
          stroke="url(#silverStrokeGrad)" 
          stroke-width="2.5"
          filter="url(#subtleGlow)">RE</text>

    <!-- Subtitle: CELULARES & TECNOLOGÍA -->
    <text x="10" y="165" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="14"
          fill="#1A1A1A">CELULARES &amp; TECNOLOGÍA</text>
  </g>
</svg>
